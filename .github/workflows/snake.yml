name: Generate Snake Animation

# Contribution snake, themed to the Jane Doe / Zenless Zone Zero palette.
# Two variants are produced so the README can switch with <picture>:
#   snake-dark.svg  -> used when the reader is on a dark GitHub theme
#   snake-light.svg -> used when the reader is on a light GitHub theme

on:
  schedule:
    - cron: "12 17 * * *"   # 00:12 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/snake.yml

permissions:
  contents: write

concurrency:
  group: snake
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%23ffd23f&color_dots=%232b2b3d,%238a2f4a,%23c22745,%23ff4d6d,%23ff8ab4
            dist/snake-light.svg?color_snake=%23a81f3c&color_dots=%23e6e3ec,%23f3cdd6,%23e88ba0,%23d63a56,%23a81f3c
            dist/snake.svg?color_snake=%23a81f3c&color_dots=%23e6e3ec,%23f3cdd6,%23e88ba0,%23d63a56,%23a81f3c
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push to snake-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}