name: Generate Snake Animation

on:
  schedule:
    # Jalankan otomatis setiap 24 jam
    - cron: "0 0 * * *"
  
  # Memungkinkan untuk dijalankan secara manual dari tab Actions
  workflow_dispatch:
  
  # Jalankan setiap kali ada push di branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      # Generasi file SVG ular dari kontribusi GitHub
      - name: Generate snake SVG
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Push file hasil ke branch 'snake-output'
      - name: Push to snake-output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: snake-output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
