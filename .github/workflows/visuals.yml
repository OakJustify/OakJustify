name: Profile Visuals

# Generates the two animated/dynamic SVGs used by README.md:
#   profile-3d-contrib/jane-night.svg  -> 3D contribution city  (3d action)
#   assets/chess.svg                   -> contribution chessboard (local script)
# Both are committed back to main so the README stays self-contained.

on:
  schedule:
    - cron: "27 17 * * *"   # 00:27 WIB
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "assets/**"

permissions:
  contents: write

concurrency:
  group: profile-visuals
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Generate 3D contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: scripts/3d-settings.json

      - name: Give the city its idle animation
        run: python3 scripts/animate_city.py profile-3d-contrib/jane-night.svg

      - name: Generate contribution chessboard
        run: python3 scripts/chess_contrib.py --out assets/chess.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      - name: Commit & push
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile-3d-contrib assets/chess.svg
          if git diff --staged --quiet; then
            echo "nothing to commit"
            exit 0
          fi
          git commit -m "chore: refresh 3D contribution + chess visuals"
          for i in 1 2 3; do
            git push && exit 0
            echo "push failed, retrying in 5s ($i/3)"
            sleep 5
            git pull --rebase origin main
          done
          exit 1